name: DouDuo
options:
  bundleIdPrefix: me.rrmm
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
packages:
  VLCKitSPM:
    path: Vendor/VLCKit
settings:
  base:
    MARKETING_VERSION: 1.3.11
    CURRENT_PROJECT_VERSION: "91"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  DouDuo:
    type: application
    platform: iOS
    sources:
      - path: DouDuo
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenghongjvn.douduo
        PRODUCT_NAME: DouDuo
        INFOPLIST_KEY_CFBundleDisplayName: DouDuo
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存视频和图集到相册
    info:
      path: DouDuo/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 后台播放：默认仍是切后台就停声；只有「更多」菜单里打开「后台播放」才会继续响（代码里按开关判断）
        UIBackgroundModes: [audio]
  DouDuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DouDuoUITests
    dependencies:
      - target: DouDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zenghongjvn.douduo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DouDuo
schemes:
  DouDuo:
    build:
      targets:
        DouDuo: all
        DouDuoUITests: [test]
    test:
      targets:
        - DouDuoUITests
