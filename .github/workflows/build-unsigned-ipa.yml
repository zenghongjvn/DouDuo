name: Build unsigned IPA

on:
  push:
    branches: [bottom-align]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: xcodebuild -version
      - name: Build and validate unsigned Duo IPA
        run: bash scripts/build-unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DouDuo-1.3.11-build91-Duo-unsigned
          path: |
            output/*.ipa
            output/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/unsigned-build.log
          if-no-files-found: ignore
          retention-days: 14
