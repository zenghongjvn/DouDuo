name: Duo UI tests (1.3.11 build 92)

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "要跑的用例（空格分隔的方法名）"
        required: false
        default: "testSystemBarsDockAndComments"

permissions:
  contents: read

jobs:
  uitest:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools and test video
        run: |
          xcodebuild -version
          brew install xcodegen ffmpeg
          sh scripts/fetch-vlckit.sh
          xcodegen generate
          mkdir -p out media
          ffmpeg -loglevel error -f lavfi -i "color=c=0x333333:s=720x1280:d=30:r=30" \
            -vf "drawgrid=w=80:h=80:c=white@0.2,drawbox=x=iw/2-6:y=0:w=12:h=ih:c=white@0.8:t=fill" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart media/narrow.mp4
          ls -la media
          # 模拟器里的 App 读不到 runner 的文件（上一轮 status 一直 unknown），改用本机小服务器喂片
          (cd media && python3 -m http.server 8787 >/dev/null 2>&1 &)
          sleep 2; curl -sI http://127.0.0.1:8787/narrow.mp4 | head -1
      - name: Boot iPhone Duo
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in d.items():
              for x in devs:
                  if x["name"]=="iPhone Duo": print(x["udid"]); sys.exit()
          ')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b; sleep 15
      - name: Run UI tests
        run: |
          set -o pipefail
          ONLY=""
          for t in ${{ inputs.tests }}; do ONLY="$ONLY -only-testing:DouDuoUITests/DouDuoUITests/$t"; done
          set +e
          xcodebuild test -project DouDuo.xcodeproj -scheme DouDuo -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" $ONLY \
            -resultBundlePath out/result.xcresult \
            TEST_RUNNER_DOUDUO_MEDIA="http://127.0.0.1:8787" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee out/test.log | grep -E "DDTEST|Test Case|error:|failed|passed|\*\* TEST" 
          echo "exit=${PIPESTATUS[0]}" | tee out/exit.txt
          C=$(xcrun simctl get_app_container "$UDID" com.zenghongjvn.douduo data 2>/dev/null); cp "$C/Documents/ddlog.txt" out/ddlog.txt 2>/dev/null || true
          # 导出截图附件
          xcrun xcresulttool export attachments --path out/result.xcresult --output-path out/attachments 2>/dev/null || true
          xcrun xcresulttool get test-results summary --path out/result.xcresult > out/summary.json 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-uitest
          path: out
          retention-days: 14
